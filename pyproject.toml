[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natlas-workbench"
version = "0.2.0"
description = "Developer toolkit for building applications on N-ATLaS inference runtimes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gradio = ["gradio_client>=1.5,<3.0"]
openai = ["openai>=1.40,<3.0"]
local = ["llama-cpp-python"]
server = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.7,<3.0"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
natlas = "scaffold.cli:main"

[tool.setuptools]
packages = ["natlas_sdk", "runtime", "adapter", "adapter.natlas", "evaluation", "scaffold"]

[tool.setuptools.package-dir]
natlas_sdk = "sdk/natlas_sdk"

[tool.setuptools.package-data]
scaffold = ["templates/**/*", "templates/**/.*"]
